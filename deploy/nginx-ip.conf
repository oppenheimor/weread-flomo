# Temporary IP HTTPS endpoint; existing domain vhosts and DNS are unchanged.
server {
    listen 80;
    server_name 14.103.81.73;
    server_tokens off;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /shimo { return 301 https://14.103.81.73/shimo/$is_args$args; }
    location ^~ /shimo/ { return 301 https://14.103.81.73$request_uri; }
    location / { return 404; }
}
server {
    # IP clients may send no SNI: use the IP certificate as the TLS default.
    listen 443 ssl default_server;
    http2 on;
    server_name 14.103.81.73;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/shimo-ip.crt;
    ssl_certificate_key /etc/nginx/certs/shimo-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json;
    location = /shimo { return 301 /shimo/$is_args$args; }
    # Preserve the original IP HTTPS fallback; only /shimo/ belongs to this app.
    location / { return 301 https://www.sparkden.cn$request_uri; }
    location ^~ /shimo/ {
        proxy_pass http://172.19.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Never replay a send after an upstream failure.
        proxy_next_upstream off;

        # Only public build assets may be cached. HTML and all APIs retain no-store.
        # One hour avoids indefinitely caching unversioned logos and font files.
        location ^~ /shimo/assets/ {
            proxy_pass http://172.19.0.1:18081;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }
    }
}
